# Solo para crear migraciones en desarrollo; la app aplica las pendientes al arrancar.
#   uv run alembic -c backend/alembic.ini revision --autogenerate -m "mensaje"
# La base usada es la de MAMONEY_DATA_DIR (por defecto %APPDATA%\Mamoney).
[alembic]
script_location = %(here)s/mamoney/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
