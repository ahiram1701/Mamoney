[project]
name = "mamoney"
version = "0.3.0"
description = "Gestor personal de patrimonio, ingresos y gastos fijos con dashboard web privado vía Tailscale."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "A. Hiram" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.3",
    "pystray>=0.19",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4",
]
build = [
    "pyinstaller>=6.11",
]

[project.scripts]
mamoney-server = "mamoney.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/mamoney"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]
extend-exclude = ["backend/mamoney/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# El launcher desbloquea sus archivos antes de importar pywebview/pythonnet.
"launcher.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
packages = ["mamoney"]
mypy_path = "backend"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["migrations/versions/"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["mamoney"]
omit = ["backend/mamoney/migrations/*"]
